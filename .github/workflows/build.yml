name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-28" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=/usr/local/lib/android/sdk
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azurehub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
